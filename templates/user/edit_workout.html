{% extends 'base.html' %}
{% block title %}Edit Workout — Gym Tracker{% endblock %}
{% block content %}
<div class="row justify-content-center reveal in-view">
    <div class="col-lg-9">
        <div class="row g-0 split-hero">
            <div class="col-md-5 split-hero-panel p-strength">
                <div>
                    <div class="hero-eyebrow mb-2">Fine-tune the log</div>
                    <p class="split-hero-quote">
                        Adjust the numbers, <span class="amber">not the effort.</span>
                    </p>
                    <p class="text-muted mt-3 mb-0" style="max-width: 30ch;">
                        Keep your log honest and your progress keeps compounding.
                    </p>
                </div>
            </div>
            <div class="col-md-7 split-form-panel">
                <h4 class="card-title mb-3">Edit Workout Record</h4>
                <form method="POST" action="{{ url_for('user.edit_workout', id=workout.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Exercise Name</label>
                        <input type="text" name="exercise_name" class="form-control" value="{{ workout.exercise_name }}" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Sets</label>
                            <input type="number" name="sets" class="form-control" value="{{ workout.sets }}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Reps</label>
                            <input type="number" name="reps" class="form-control" value="{{ workout.reps }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Weight (kg)</label>
                        <input type="number" step="0.5" name="weight" class="form-control" value="{{ workout.weight }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Notes</label>
                        <input type="text" name="notes" class="form-control" value="{{ workout.notes or '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-glow">Update Workout</button>
                        <a href="{{ url_for('user.dashboard') }}" class="btn btn-outline-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
